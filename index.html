<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi's Gallery</title>
<style>
  :root {
    --cream: #fff6e6;
    --peach: #ffd9a8;
    --orange: #f08a3c;
    --brown: #6b3e1f;
    --brown-soft: #9a6b45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--brown);
    background:
      radial-gradient(circle at 15% 10%, #ffe7c2 0, transparent 40%),
      radial-gradient(circle at 85% 20%, #ffd9d0 0, transparent 35%),
      radial-gradient(circle at 50% 100%, #ffe9b8 0, transparent 45%),
      var(--cream);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* ---- Header ---- */
  header { text-align: center; padding: 56px 16px 28px; }
  .paw { font-size: 2.2rem; display: block; margin-bottom: 4px; }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: .5px;
    background: linear-gradient(90deg, #d9651b, #f5a742, #d9651b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { margin: 8px 0 14px; color: var(--brown-soft); font-style: italic; }
  #count {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 999px;
    background: #fff;
    border: 2px solid var(--peach);
    color: var(--orange);
    font-weight: 600;
    font-size: .9rem;
  }
  #count:empty { display: none; }
  .divider {
    width: 140px; height: 4px; margin: 22px auto 0;
    border-radius: 4px;
    background: repeating-linear-gradient(90deg, var(--orange) 0 10px, transparent 10px 18px);
    opacity: .5;
  }

  #status { text-align: center; padding: 32px 16px; color: var(--brown-soft); }

  /* ---- Gallery (masonry, photos are never cropped) ---- */
  #grid {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 20px 56px;
    columns: 4 240px;
    column-gap: 20px;
  }
  .card {
    display: block;
    width: 100%;
    margin: 0 0 20px;
    padding: 8px 8px 12px;
    border: 0;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(107, 62, 31, .15);
    cursor: pointer;
    break-inside: avoid;
    text-align: center;
    color: inherit;
    font: inherit;
    transition: transform .25s ease, box-shadow .25s ease;
    opacity: 0;
    animation: pop .5s ease forwards;
  }
  .card:nth-child(odd)  { rotate: -1deg; }
  .card:nth-child(even) { rotate: 1deg; }
  .card:hover, .card:focus-visible {
    rotate: 0deg;
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 16px 32px rgba(240, 138, 60, .35);
    outline: none;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: var(--peach);
  }
  .card span {
    display: block;
    margin-top: 8px;
    font-size: .8rem;
    color: var(--brown-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  footer { text-align: center; padding: 0 16px 32px; color: var(--brown-soft); font-size: .85rem; }

  /* ---- Lightbox ---- */
  #lightbox {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: rgba(50, 25, 10, .88);
    backdrop-filter: blur(6px);
  }
  #lightbox.open { display: flex; }
  #full {
    max-width: 92vw; max-height: 84vh;
    border: 8px solid #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  #caption { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--peach); font-size: .9rem; }
  .nav {
    position: absolute; border: 0; cursor: pointer;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255, 255, 255, .9); color: var(--orange);
    font-size: 1.8rem; line-height: 1;
    transition: transform .2s;
  }
  .nav:hover { transform: scale(1.1); }
  #prev { left: 14px; } #next { right: 14px; } #close { top: 14px; right: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transition: none; }
  }
</style>
</head>
<body>
<header>
  <span class="paw" aria-hidden="true">&#128062;</span>
  <h1 id="title">Mochi's Gallery</h1>
  <p class="tagline">Relax &middot; Laugh &middot; Enjoy</p>
  <div id="count"></div>
  <div class="divider"></div>
</header>
<div id="status">Loading photos…</div>
<main id="grid"></main>
<footer>Made with love for Mochi &#128062;</footer>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="nav" id="close" aria-label="Close">&times;</button>
  <button class="nav" id="prev" aria-label="Previous photo">&#8249;</button>
  <img id="full" alt="">
  <button class="nav" id="next" aria-label="Next photo">&#8250;</button>
  <div id="caption"></div>
</div>

<script>
// ---- Settings ----
// Leave owner/repo empty when hosted on GitHub Pages (auto-detected from the URL).
// Fill them in for a custom domain or when testing locally.
const CONFIG = {
  title: "Mochi's Gallery",
  owner: "",
  repo: "",
  folder: "photos",
  extensions: ["jpg", "jpeg", "png", "gif", "webp", "avif"]
};

const $ = (id) => document.getElementById(id);
let photos = [];
let current = 0;

function detectRepo() {
  if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return null;
  const owner = m[1];
  const first = location.pathname.split("/").filter(Boolean)[0];
  const repo = first && !first.includes(".") ? first : owner + ".github.io";
  return { owner, repo };
}

function showStatus(msg) {
  $("status").textContent = msg;
  $("status").style.display = msg ? "block" : "none";
}

async function loadPhotos() {
  const target = detectRepo();
  if (!target) {
    showStatus("Set CONFIG.owner and CONFIG.repo in index.html (not running on GitHub Pages).");
    return;
  }
  const api = "https://api.github.com/repos/" + encodeURIComponent(target.owner) + "/" +
    encodeURIComponent(target.repo) + "/contents/" + encodeURIComponent(CONFIG.folder);
  try {
    const res = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();
    const exts = new Set(CONFIG.extensions);
    photos = items
      .filter((f) => f.type === "file" && exts.has(f.name.split(".").pop().toLowerCase()))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
      .map((f) => ({ name: f.name, url: CONFIG.folder + "/" + encodeURIComponent(f.name) }));
    render();
  } catch (e) {
    showStatus("Could not load photos. Check the folder name, or try again later (GitHub API rate limit).");
  }
}

function render() {
  const grid = $("grid");
  grid.textContent = "";
  if (!photos.length) { showStatus("No photos found in the “" + CONFIG.folder + "” folder."); return; }
  showStatus("");
  $("count").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
  photos.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    b.style.animationDelay = Math.min(i * 60, 900) + "ms";
    b.setAttribute("aria-label", "Open " + p.name);
    const img = document.createElement("img");
    img.src = p.url; img.alt = p.name; img.loading = "lazy";
    const cap = document.createElement("span");
    cap.textContent = p.name.replace(/\.[^.]+$/, "");
    b.append(img, cap);
    b.addEventListener("click", () => open(i));
    grid.appendChild(b);
  });
}

function open(i) {
  current = (i + photos.length) % photos.length;
  $("full").src = photos[current].url;
  $("full").alt = photos[current].name;
  $("caption").textContent = photos[current].name + "  (" + (current + 1) + "/" + photos.length + ")";
  $("lightbox").classList.add("open");
}
function close() { $("lightbox").classList.remove("open"); $("full").removeAttribute("src"); }

$("close").addEventListener("click", close);
$("prev").addEventListener("click", () => open(current - 1));
$("next").addEventListener("click", () => open(current + 1));
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) close(); });
document.addEventListener("keydown", (e) => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") open(current - 1);
  if (e.key === "ArrowRight") open(current + 1);
});

document.title = CONFIG.title;
$("title").textContent = CONFIG.title;
loadPhotos();
</script>
</body>
</html>
