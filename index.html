<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Album</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 24px 16px; text-align: center; }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  #count { color: #999; font-size: .9rem; }
  #status { text-align: center; padding: 24px 16px; color: #bbb; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 8px; }
  #grid button { padding: 0; border: 0; background: #222; cursor: pointer; aspect-ratio: 1 / 1; overflow: hidden; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  #grid button:hover img, #grid button:focus-visible img { transform: scale(1.05); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 86vh; }
  #caption { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #bbb; font-size: .9rem; }
  .nav { position: absolute; background: none; border: 0; color: #fff; font-size: 2.5rem; cursor: pointer; padding: 16px; }
  #prev { left: 8px; } #next { right: 8px; } #close { top: 8px; right: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Photo Album</h1>
  <div id="count"></div>
</header>
<div id="status">Loading photos…</div>
<main id="grid"></main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="nav" id="close" aria-label="Close">&times;</button>
  <button class="nav" id="prev" aria-label="Previous photo">&#8249;</button>
  <img id="full" alt="">
  <button class="nav" id="next" aria-label="Next photo">&#8250;</button>
  <div id="caption"></div>
</div>

<script>
// ---- Settings ----
// Leave owner/repo empty when hosted on GitHub Pages (auto-detected from the URL).
// Fill them in for a custom domain or when testing locally.
const CONFIG = {
  title: "Photo Album",
  owner: "",
  repo: "",
  folder: "photos",
  extensions: ["jpg", "jpeg", "png", "gif", "webp", "avif"]
};

const $ = (id) => document.getElementById(id);
let photos = [];
let current = 0;

function detectRepo() {
  if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return null;
  const owner = m[1];
  const first = location.pathname.split("/").filter(Boolean)[0];
  const repo = first && !first.includes(".") ? first : owner + ".github.io";
  return { owner, repo };
}

function showStatus(msg) {
  $("status").textContent = msg;
  $("status").style.display = msg ? "block" : "none";
}

async function loadPhotos() {
  const target = detectRepo();
  if (!target) {
    showStatus("Set CONFIG.owner and CONFIG.repo in index.html (not running on GitHub Pages).");
    return;
  }
  const api = "https://api.github.com/repos/" + encodeURIComponent(target.owner) + "/" +
    encodeURIComponent(target.repo) + "/contents/" + encodeURIComponent(CONFIG.folder);
  try {
    const res = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();
    const exts = new Set(CONFIG.extensions);
    photos = items
      .filter((f) => f.type === "file" && exts.has(f.name.split(".").pop().toLowerCase()))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
      .map((f) => ({ name: f.name, url: CONFIG.folder + "/" + encodeURIComponent(f.name) }));
    render();
  } catch (e) {
    showStatus("Could not load photos. Check the folder name, or try again later (GitHub API rate limit).");
  }
}

function render() {
  const grid = $("grid");
  grid.textContent = "";
  if (!photos.length) { showStatus("No photos found in the “" + CONFIG.folder + "” folder."); return; }
  showStatus("");
  $("count").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
  photos.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Open " + p.name);
    const img = document.createElement("img");
    img.src = p.url; img.alt = p.name; img.loading = "lazy";
    b.appendChild(img);
    b.addEventListener("click", () => open(i));
    grid.appendChild(b);
  });
}

function open(i) {
  current = (i + photos.length) % photos.length;
  $("full").src = photos[current].url;
  $("full").alt = photos[current].name;
  $("caption").textContent = photos[current].name + "  (" + (current + 1) + "/" + photos.length + ")";
  $("lightbox").classList.add("open");
}
function close() { $("lightbox").classList.remove("open"); $("full").src = ""; }

$("close").addEventListener("click", close);
$("prev").addEventListener("click", () => open(current - 1));
$("next").addEventListener("click", () => open(current + 1));
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) close(); });
document.addEventListener("keydown", (e) => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") open(current - 1);
  if (e.key === "ArrowRight") open(current + 1);
});

document.title = CONFIG.title;
$("title").textContent = CONFIG.title;
loadPhotos();
</script>
</body>
</html>
